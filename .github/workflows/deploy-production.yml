name: Deploy — Production

# Owner-authorized manual trigger only. Never runs automatically on push.
on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "I confirm this release has been approved by the project owner"
        required: true
        type: boolean
      sha:
        description: "Commit SHA to deploy (leave blank for HEAD)"
        required: false

jobs:
  gate:
    name: Owner authorization
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation
        if: ${{ inputs.confirmed != true }}
        run: |
          echo "::error::Production deployment requires explicit owner confirmation."
          exit 1

  build-and-deploy:
    name: Build & deploy
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXTAUTH_URL: ${{ secrets.AUTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DESIGN_PREVIEW_PASSWORD: ${{ secrets.DESIGN_PREVIEW_PASSWORD }}
          HOSTNAME: "0.0.0.0"

      - name: Prepare standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Deploy standalone via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            .next/standalone/ \
            fixernat@${{ secrets.DEPLOY_HOST }}:repositories/fixernationorg/.next/standalone/

      - name: Sync prisma migrations
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            prisma/ \
            fixernat@${{ secrets.DEPLOY_HOST }}:repositories/fixernationorg/prisma/

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > /tmp/fn-db.env
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/fn-db.env fixernat@${{ secrets.DEPLOY_HOST }}:/tmp/fn-db.env
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            fixernat@${{ secrets.DEPLOY_HOST }} \
            'set -a && . /tmp/fn-db.env && set +a &&
             source /home/fixernat/nodevenv/repositories/fixernationorg/24/bin/activate &&
             cd /home/fixernat/repositories/fixernationorg &&
             ./node_modules/.bin/prisma migrate deploy;
             rm -f /tmp/fn-db.env'
          rm -f /tmp/fn-db.env

      - name: Summary
        run: |
          {
            echo "## Deploy complete"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Deployed by:** ${{ github.actor }}"
            echo ""
            echo "### Manual step required"
            echo "Restart the Node.js app in cPanel: **Setup Node.js App → Restart application**"
            echo ""
            echo "Then verify: https://fixernation.org/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
