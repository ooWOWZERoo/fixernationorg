name: Build & Deploy fixernation.org

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://fixernation.org
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Bundle Prisma CLI into standalone
        run: |
          cp -rL node_modules/prisma .next/standalone/node_modules/prisma
          cp -rL node_modules/@prisma/. .next/standalone/node_modules/@prisma/

      - name: Prepare standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy standalone bundle
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            .next/standalone/ \
            fixernat@${SSH_HOST}:~/repositories/fixernationorg/.next/standalone/

      - name: Sync prisma migrations
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            prisma/ \
            fixernat@${SSH_HOST}:~/repositories/fixernationorg/prisma/

      - name: Run database migrations via SSH tunnel
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} \
              -o StrictHostKeyChecking=no \
              -f -N -L 5432:localhost:5432 \
              fixernat@${SSH_HOST}
          sleep 2
          npx prisma migrate deploy
          pkill -f "ssh.*5433:localhost" || true
