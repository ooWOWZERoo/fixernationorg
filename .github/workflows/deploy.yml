name: Build & Deploy fixernation.org

on:
  workflow_dispatch: # manual trigger only — Vercel handles automatic deploys

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://fixernation.org
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Bundle Prisma CLI into standalone
        run: |
          mkdir -p .next/standalone/node_modules/@prisma
          cp -rL node_modules/prisma .next/standalone/node_modules/prisma
          cp -rL node_modules/@prisma/. .next/standalone/node_modules/@prisma/

      - name: Prepare standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy standalone bundle
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            .next/standalone/ \
            fixernat@${SSH_HOST}:~/repositories/fixernationorg/.next/standalone/

      - name: Sync static files to public_html
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            .next/static/ \
            fixernat@${SSH_HOST}:~/public_html/.next/static/

      - name: Sync deploy script
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            deploy.sh \
            fixernat@${SSH_HOST}:~/repositories/fixernationorg/deploy.sh

      - name: Sync prisma migrations
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            prisma/ \
            fixernat@${SSH_HOST}:~/repositories/fixernationorg/prisma/

      - name: Run database migrations
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          # SSH command execution may be blocked on this host. The step is best-effort.
          # If it fails, run migrations manually from cPanel Terminal (see CLAUDE.md).
          ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              fixernat@${SSH_HOST} \
              'source /home/fixernat/nodevenv/repositories/fixernationorg/24/bin/activate \
               && cd /home/fixernat/repositories/fixernationorg \
               && export DATABASE_URL=$(grep -oP "(?<=SetEnv DATABASE_URL ).*" ~/public_html/.htaccess) \
               && node .next/standalone/node_modules/prisma/build/index.js migrate deploy' \
          || echo "::warning::Migration via SSH failed — run manually from cPanel Terminal if the schema changed."

      - name: Restart app
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          # Passenger watches tmp/restart.txt — updating it triggers a clean restart.
          # This avoids running arbitrary SSH commands, which cPanel shared hosting blocks.
          date -u > restart-trigger.txt
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            restart-trigger.txt \
            fixernat@${SSH_HOST}:~/repositories/fixernationorg/tmp/restart.txt
          rm restart-trigger.txt
